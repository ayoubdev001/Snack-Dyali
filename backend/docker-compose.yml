services:
  postgres:
    image: postgres:16
    container_name: snack-postgres
    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - snack_postgres_data:/var/lib/postgresql/data

volumes:
  snack_postgres_data: